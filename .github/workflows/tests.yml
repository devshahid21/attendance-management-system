name: Laravel tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, pdo_sqlite, sqlite3, bcmath, curl, fileinfo, openssl, tokenizer
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan route:list
        env:
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      - run: php artisan view:cache
        env:
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      - run: php artisan test --display-warnings --no-ansi
